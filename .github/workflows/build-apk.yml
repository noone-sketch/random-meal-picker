name: Build Android APK (Capacitor)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192x192.png icon-512x512.png icon-maskable-512x512.png www/

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Generate app icons
        run: |
          pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('icon-512x512.png').convert('RGBA')
          base = 'android/app/src/main/res'
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              folder = f'{base}/mipmap-{d}'
              os.makedirs(folder, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(f'{folder}/ic_launcher.png')
              img.save(f'{folder}/ic_launcher_round.png')
          for d, s in {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}.items():
              folder = f'{base}/mipmap-{d}'
              canvas = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              inner = int(s * 0.66)
              icon = src.resize((inner, inner), Image.LANCZOS)
              off = (s - inner) // 2
              canvas.paste(icon, (off, off), icon)
              canvas.save(f'{folder}/ic_launcher_foreground.png')
          print('app icons generated')
          PY

      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Restore signing keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Configure signing in build.gradle
        run: |
          python3 - <<'PY'
          import re, sys
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          sc = """    signingConfigs {
              release {
                  storeFile file('release.keystore')
                  storePassword 'random-meal-picker'
                  keyAlias 'release'
                  keyPassword 'random-meal-picker'
              }
          }
          """
          s2 = re.sub(r'(\n\s*defaultConfig\s*\{)', '\n' + sc + r'\1', s, count=1)
          if s2 == s:
              print('ERROR: defaultConfig block not found'); sys.exit(1)
          s = s2
          s2 = re.sub(r'(buildTypes\s*\{[^{}]*?release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
          if s2 == s:
              print('ERROR: buildTypes.release block not found'); sys.exit(1)
          s = s2
          open(p, 'w', encoding='utf-8').write(s)
          print('Patched build.gradle successfully')
          PY

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs -name "*.apk" -type f | grep -v -- '-unsigned' | head -1)
          echo "APK_PATH=${APK}" >> "$GITHUB_OUTPUT"
          echo "Found APK: ${APK}"
          ls -lh "${APK}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
